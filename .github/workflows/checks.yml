# Runs on every push and PR: the automated safety net between checkpoint reviews.
name: checks
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Data contract + cross-thread compatibility (sample)
        run: python -m afterlife.check sample
        env:
          PYTHONIOENCODING: utf-8
      - name: Tests (incl. generator, matcher accuracy floors, no-literals)
        run: python -m pytest -q
      - name: Pipeline runs end to end
        run: python -m afterlife.run

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Type check
        run: npx tsc --noEmit
        working-directory: web
